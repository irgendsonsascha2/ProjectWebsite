<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Platzhalter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- No inner frame: art hugs the image edges -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#glow)"/>

  <circle cx="250" cy="250" r="78" fill="url(#ink)" fill-opacity="0.85"/>
  <path d="M0 620 L210 430 L360 560 L520 380 L800 610 L800 800 L0 800 Z" fill="url(#ink)" fill-opacity="0.75"/>
  <path d="M0 720 L250 520 L410 680 L560 520 L800 730 L800 800 L0 800 Z" fill="url(#ink)" fill-opacity="0.38"/>
</svg>
