# Lokale Entwicklungsdienste (MongoDB + MailHog).
# PHP/Laravel weiterhin auf dem Host: make php / make laravel
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Daten:  Volume mongo_data (persistent)

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mongo_data:
