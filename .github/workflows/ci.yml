name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audits:
    name: Audits (Composer + npm) [non-blocking]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mongodb
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Composer audit (root)
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --no-interaction

      - name: Composer audit (laravel)
        run: |
          cd laravel
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --no-interaction

      - name: npm audit (frontend)
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high

      - name: npm audit (laravel)
        run: |
          cd laravel
          npm ci
          npm audit --audit-level=high

  frontend:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

  php_legacy:
    name: Legacy PHP (Composer + syntax)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mongodb
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-root-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-root-

      - name: Install Composer deps (root)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            php -l "$f" >/dev/null
          done < <(git ls-files '*.php')

  legacy_db:
    name: Legacy PHP (MongoDB baseline + tests)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mongodb
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-root-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-root-

      - name: Install Composer deps (root)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run DB baseline (idempotent 14/15/16)
        env:
          APP_ENV: testing
          APP_DB_NAME: portfolio_db_ci
          APP_DB_URI: mongodb://127.0.0.1:27017
          VIEWER_DB_URI: mongodb://127.0.0.1:27017
          COMMUNITY_DB_URI: mongodb://127.0.0.1:27017
          CONTENT_MANAGER_DB_URI: mongodb://127.0.0.1:27017
          ADMIN_DB_URI: mongodb://127.0.0.1:27017
        run: php scripts/ensure-db-baseline.php

      - name: Run integration tests
        env:
          APP_ENV: testing
          APP_DB_NAME: portfolio_db_ci
          APP_DB_URI: mongodb://127.0.0.1:27017
          VIEWER_DB_URI: mongodb://127.0.0.1:27017
          COMMUNITY_DB_URI: mongodb://127.0.0.1:27017
          CONTENT_MANAGER_DB_URI: mongodb://127.0.0.1:27017
          ADMIN_DB_URI: mongodb://127.0.0.1:27017
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

  phpstan_legacy:
    name: Legacy PHP (PHPStan) [non-blocking]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mongodb
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-root-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-root-

      - name: Install Composer deps (root)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan (legacy)
        run: vendor/bin/phpstan analyse -c phpstan.neon --memory-limit=512M

  laravel_style:
    name: Laravel style (Pint) [non-blocking]
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: laravel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mongodb
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-laravel-${{ hashFiles('laravel/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-laravel-

      - name: Install Composer deps (laravel)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint (check)
        run: vendor/bin/pint --test

  laravel:
    name: Laravel (Mongo + tests)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: laravel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mongodb
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-laravel-${{ hashFiles('laravel/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-laravel-

      - name: Install Composer deps (laravel)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare app env
        run: |
          cp -n .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: mongodb
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: portfolio_db_test
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: mongodb
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DATABASE: portfolio_db_test
          HANDOFF_SECRET: ""
          LEGACY_SITE_URL: ""
        run: php artisan test

