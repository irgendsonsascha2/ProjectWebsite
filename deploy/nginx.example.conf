# Beispiel: nginx + PHP-FPM für ProjectWebsite (Projektroot = /var/www/projectwebsite)
# Anpassen: server_name, root, php-fpm.sock, TLS-Zertifikate (oder nur :443 via Certbot).

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/projectwebsite;
    index index.php;

    client_max_body_size 2100M;

    # Medien nur über App — kein direkter Zugriff auf content/
    location ^~ /content/ {
        deny all;
        return 404;
    }

    location ^~ /logs/ {
        deny all;
        return 404;
    }

    location ^~ /dbScripts/ {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }
}

